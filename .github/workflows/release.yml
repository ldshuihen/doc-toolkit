name: Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build Frontend & Single JAR
        shell: pwsh
        run: |
          cd frontend; npm ci; npm run build
          cd ../backend; mvn -B clean package

      - name: Package Portable EXE with jpackage
        shell: pwsh
        run: |
          $stage = "backend/target/jpackage-input"
          New-Item -ItemType Directory -Force $stage, "release" | Out-Null
          Copy-Item "backend/target/tool-kit-1.0.0.jar" "$stage/tool-kit-1.0.0.jar"
          jpackage `
            --type app-image `
            --name DocToolkit `
            --app-version 1.0.0 `
            --vendor "doc-toolkit" `
            --icon "assets/app.ico" `
            --input $stage `
            --main-jar tool-kit-1.0.0.jar `
            --dest release `
            --add-modules java.base,java.compiler,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.unsupported,jdk.zipfs `
            --java-options "-Dtoolkit.desktop=true" `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Xms128m" `
            --java-options "-Xmx1024m"
          Compress-Archive -Path "release/DocToolkit" -DestinationPath "release/DocToolkit-win-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocToolkit-win-x64
          path: release/DocToolkit-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/DocToolkit-win-x64.zip
          generate_release_notes: true
          body: |
            ## 文档工具箱（Windows 免安装绿色版）

            本地运行的 PDF、图片、Word 与文件批量处理工具箱，所有文件均在本机处理，不上传第三方服务器。

            ### 下载与使用
            1. 在下方 **Assets** 中下载 `DocToolkit-win-x64.zip` 并解压；
            2. 双击目录内的 `DocToolkit.exe` 即可使用（**无需安装 JDK / Java / Node.js**，已内置精简运行时）；
            3. 启动后自动在浏览器打开页面，并在 Windows 右下角常驻系统托盘图标；可直接点击**网页右上角“退出程序”按钮**或在托盘右键退出程序。

            ### 注意事项
            - 除 **Word 转 PDF** 需要本机安装 Microsoft Word 外，其余 9 项工具开箱即用。
            - 首次运行若弹出 Windows SmartScreen 提示，点击“更多信息 → 仍要运行”即可。
            - 默认监听 `8080` 端口，若被占用会自动顺延切换为空闲端口。

            ---

