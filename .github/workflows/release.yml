name: Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build Frontend & Single JAR
        shell: pwsh
        run: |
          cd frontend; npm ci; npm run build
          cd ../backend; mvn -B clean package

      - name: Package Portable EXE with jpackage
        shell: pwsh
        run: |
          $stage = "backend/target/jpackage-input"
          New-Item -ItemType Directory -Force $stage, "release" | Out-Null
          Copy-Item "backend/target/tool-kit-1.0.0.jar" "$stage/tool-kit-1.0.0.jar"
          jpackage `
            --type app-image `
            --name DocToolkit `
            --app-version 1.0.0 `
            --vendor "doc-toolkit" `
            --icon "assets/app.ico" `
            --input $stage `
            --main-jar tool-kit-1.0.0.jar `
            --dest release `
            --add-modules java.base,java.compiler,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.unsupported,jdk.zipfs `
            --java-options "-Dtoolkit.desktop=true" `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Xms128m" `
            --java-options "-Xmx1024m"
          Compress-Archive -Path "release/DocToolkit" -DestinationPath "release/DocToolkit-win-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocToolkit-win-x64
          path: release/DocToolkit-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/DocToolkit-win-x64.zip
          generate_release_notes: true

